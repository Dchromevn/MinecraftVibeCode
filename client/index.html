<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Survival</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 8px; left: 8px;
        color: #fff; font: 13px/1.5 monospace;
        text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; white-space: pre;
      }
      #center {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        color: #fff; font: 16px/1.6 monospace; text-align: center;
        background: rgba(0, 0, 0, 0.55); padding: 12px 18px; border-radius: 6px;
        pointer-events: none; white-space: pre;
      }
      #tint { position: fixed; inset: 0; pointer-events: none; display: none; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%);
        pointer-events: none; mix-blend-mode: difference;
      }
      #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
      #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
      #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }
    </style>
  </head>
  <body>
    <div id="tint"></div>
    <div id="crosshair"></div>
    <div id="hud"></div>
    <div id="center"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
